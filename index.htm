function countryInfo(){return COUNTRIES.find(x=>x[1]===state.country)||COUNTRIES[0]}
function rssUrl(query,site,top=false){const [,cc,defaultLang]=countryInfo(),lang=state.language||defaultLang,q=[top?'trending':query||'trending',site?`site:${site}`:'',state.category!=='general'?state.category:'','when:7d'].filter(Boolean).join(' ');return `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=${lang}-${cc}&gl=${cc}&ceid=${cc}:${lang}`}
function getFeedJsonp(feed){return new Promise((resolve,reject)=>{const callback='rssCallback'+Date.now()+Math.random().toString(36).slice(2),script=document.createElement('script'),timer=setTimeout(()=>finish(Error('Feed request timed out')),15000);function finish(error,data){clearTimeout(timer);try{delete window[callback]}catch{}script.remove();error?reject(error):resolve(data)}window[callback]=data=>finish(null,data);script.onerror=()=>finish(Error('Feed request failed'));script.src='https://api.rss2json.com/v1/api.json?callback='+callback+'&rss_url='+encodeURIComponent(feed);document.head.appendChild(script)})}
async function loadFeed(id,query,top){const src=SOURCES[id],feed=rssUrl(query,src.site,top);let j;try{j=await getFeedJsonp(feed)}catch(e){const bridge='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);j=await getJson(bridge)}if(j.status!=='ok')throw Error(j.message||src.name+' unavailable');return (j.items||[]).map((x,i)=>{const raw=x.description||x.content||'',doc=new DOMParser().parseFromString(raw,'text/html'),found=doc.querySelector('img')?.src||x.thumbnail||x.enclosure?.link,publisher=x.author||x.categories?.[0]||src.name,title=(x.title||'').replace(/\s+-\s+[^-]+$/,'').trim();let rid='';try{rid=btoa(unescape(encodeURIComponent((x.guid||x.link||String(i)).slice(0,120)))).replace(/=/g,'')}catch{rid=String(i)}return{id:id+'-'+rid,title,description:doc.body.textContent.replace(title,'').trim(),image:found||sourceBrand(publisher),url:x.link,source:publisher,publishedAt:x.pubDate,category:state.category}})}
function terms(q){return q.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]}function score(x,q){const ts=terms(q),title=x.title.toLowerCase(),desc=x.description.toLowerCase();let s=0;for(const t of ts){if(title.includes(t))s+=12;if(desc.includes(t))s+=3}if(ts.length&&ts.every(t=>title.includes(t)||desc.includes(t)))s+=15;const age=Math.max(0,(Date.now()-new Date(x.publishedAt||0))/36e5);s+=Math.max(0,20-age/8);s+=(state.likes[x.id]||0)*4+(state.comments[x.id]?.length||0)*2;return s}
function dedupe(a){const seen=new Set;return a.filter(x=>{if(!x.url||!x.title)return false;const k=x.title.toLowerCase().replace(/\W+/g,' ').trim();if(seen.has(k))return false;seen.add(k);return true})}
function rank(a,q){return a.sort((x,y)=>state.sort==='newest'?new Date(y.publishedAt)-new Date(x.publishedAt):state.sort==='engaged'?engagement(y)-engagement(x):score(y,q)-score(x,q))}function engagement(x){return(state.likes[x.id]||0)+(state.comments[x.id]?.length||0)}
function selected(){if(state.provider==='all')return state.enabled.google?['google']:Object.keys(SOURCES).filter(id=>state.enabled[id]).slice(0,1);return [state.provider].filter(id=>state.enabled[id])}
function nav(page){state.page=page;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
function render(){if(state.page==='settings')renderSettings();else if(state.page==='social')renderSocial();else if(state.page==='video')renderVideo();else if(state.page==='saved')renderCollection('Saved stories',state.results.filter(x=>state.saved.has(x.id)));else if(state.page==='recent')renderCollection('Recently opened',state.recent);else renderSearch(state.page==='top')}
function sourceOptions(){return '<option value="all">All selected sources</option>'+Object.entries(SOURCES).filter(([id])=>state.enabled[id]).map(([id,x])=>`<option value="${id}" ${state.provider===id?'selected':''}>${x.name}</option>`).join('')}
const select=(label,key,values)=>`<div class="field"><label>${label}</label><select data-filter="${key}">${values.map(v=>`<option value="${esc(Array.isArray(v)?v[1]:v)}" ${state[key]===(Array.isArray(v)?v[1]:v)?'selected':''}>${esc(Array.isArray(v)?v[0]:v)}</option>`).join('')}</select></div>`;
function topCommunityStories(){return [...state.results].sort((a,b)=>((state.likes[b.id]||0)+(state.comments[b.id]?.length||0))-((state.likes[a.id]||0)+(state.comments[a.id]?.length||0))).filter(x=>(state.likes[x.id]||0)+(state.comments[x.id]?.length||0)>0).slice(0,5)}
function openLocalRoom(kind){const m=$('#modal'),title={groups:'News Groups',discussion:'News Discussion',talk:'Talk Show Room'}[kind],items=state.community[kind]||[];m.className='modal open';m.innerHTML=`<div class="dialog"><div class="dialogHead"><b>${title}</b><button id="roomX" class="iconBtn">✕</button></div><div class="dialogBody"><p class="communityNote">This room is stored only in this browser. A server and user accounts are required for a real all-user space.</p>${items.map(x=>`<div class="comment">${esc(x.text)}<div class="muted">${formatDate(x.date)}</div></div>`).join('')||'<p class="muted">No posts yet.</p>'}<div class="field"><label>Add to this room</label><textarea id="roomText" maxlength="500"></textarea></div><button class="btn primary" id="roomAdd">Post</button></div></div>`;$('#roomX').onclick=()=>m.className='modal';$('#roomAdd').onclick=()=>{const text=$('#roomText').value.trim();if(!text)return;(state.community[kind]??=[]).push({text,date:new Date().toISOString()});localStorage.newsCommunitySpace=JSON.stringify(state.community);openLocalRoom(kind)}}
function leftPanel(){return `<aside class="leftPanel"><div class="panelCard"><h3>Community</h3><button class="panelLink" data-room="groups">👥 News Groups</button><button class="panelLink" data-room="discussion">💬 News Discussion</button><button class="panelLink" data-room="talk">🎙 Talk Show Room</button><button class="panelLink" data-page="video">▶ Reels & Shorts</button><p class="communityNote">Community posts are local to this browser.</p></div></aside>`}
function rightPanel(){const top=topCommunityStories();return `<aside class="rightPanel"><div class="panelCard"><h3>Top Stories</h3><p class="communityNote">Top 5 by likes and comments on this page.</p>${top.length?top.map((x,i)=>`<div class="topStoryMini"><button data-story="${esc(x.id)}">${i+1}. ${esc(x.title)}</button><div class="communityNote">♥ ${state.likes[x.id]||0} · 💬 ${state.comments[x.id]?.length||0}</div></div>`).join(''):'<p class="muted">Like or comment on stories to build this list.</p>'}</div><div class="adSlot"><div><b>Google Ad Space</b><span>Insert approved Google AdSense unit here.</span></div></div><div class="adSlot"><div><b>Other Advertisement</b><span>Sponsored banner or house advertisement.</span></div></div></aside>`}
function bindPanels(){$$('[data-room]').forEach(b=>b.onclick=()=>openLocalRoom(b.dataset.room));$$('[data-story]').forEach(b=>b.onclick=()=>{const x=find(b.dataset.story);if(x)openStory(x)});$$('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page))}
function renderSearch(top=false){const start=(state.pageNo-1)*state.perPage,end=Math.min(start+state.perPage,state.results.length),rows=state.results.slice(start,end),featured=rank([...state.results],state.query).slice(0,4);$('#main').innerHTML=`<div class="pageColumns">${leftPanel()}<div class="pageCenter"><div class="notice"><span><b>${top?'Top Stories':'Viral News'}</b> — Best match uses headline/summary terms, freshness, and engagement recorded in this browser. Click a picture to open its source. <button class="noticeLink" id="inlineNotice">Notice</button></span><button class="btn" id="settingsBtn">Choose sources</button></div><section class="hero"><h1>${top?'Country-wise top stories':'Find the most relevant news'}</h1><div class="sub">Search exact words or a sentence across selected publishers. Results are not invented and always retain their source link.</div><div class="searchRow"><div class="searchBox"><span>⌕</span><input id="q" placeholder="Search words or a sentence..." value="${esc(state.query)}"></div><button class="btn primary" id="searchBtn">${top?'Refresh':'Search'}</button><button class="btn optional" id="voiceBtn">🎙</button><button class="btn optional" id="clearBtn">Clear</button></div><button class="btn" id="advBtn" style="margin-top:12px">Filters</button><div class="advanced" id="advanced"><div class="filters">${select('Category','category',['general','world','nation','business','technology','entertainment','sports','science','health'])}${select('Country','country',COUNTRIES)}${select('Language','language',['en','bn','hi','zh','id','ms','ar','fa','uk','ru','fr','de','es','pt','ja','ko'])}<div class="field"><label>Source</label><select id="provider">${sourceOptions()}</select></div>${select('Order','sort',[['Best match','best'],['Newest','newest'],['Local engagement','engaged']])}</div></div></section>${featured.length?`<h2 style="margin-top:20px">Top picks</h2><p class="muted">Up to four highest-ranked stories from the current results. Public view, like and comment totals are not available without authenticated platform data.</p><section class="featured">${featured.map(card).join('')}</section>`:''}<div class="bar"><div class="leftBar"><b>${state.results.length} stor${state.results.length===1?'y':'ies'}</b><span class="muted">${rows.length?`Showing ${start+1}–${end}`:'Select sources and search'}</span></div><div class="rightBar"><select id="perPage" class="btn">${[10,20,30,50].map(n=>`<option ${n===state.perPage?'selected':''}>${n}</option>`).join('')}</select><div class="seg">${[['small','▦'],['medium','▦'],['large','▣']].map(([v,i])=>`<button data-view="${v}" class="${state.view===v?'active':''}">${i}</button>`).join('')}</div></div></div><section class="grid ${state.view}">${state.loading?'<div class="empty"><div class="spinner"></div>Loading matched stories and available pictures…</div>':rows.length?rows.map(card).join(''):'<div class="empty"><h2>No stories loaded</h2><p class="muted">Enter a search phrase or refresh Top Stories.</p></div>'}</section>${pagination()}</div>${rightPanel()}</div>`;bindSearch(top);bindPanels()}
function bindSearch(top){$('#inlineNotice')?.addEventListener('click',showNotice);$('#settingsBtn').onclick=()=>nav('settings');$('#searchBtn').onclick=()=>load(top);$('#q').onkeydown=e=>{if(e.key==='Enter')load(top)};$('#advBtn').onclick=()=>$('#advanced').classList.toggle('open');$('#clearBtn').onclick=()=>{state.query='';state.results=[];state.pageNo=1;render()};$('#voiceBtn').onclick=voice;$$('[data-filter]').forEach(x=>x.onchange=()=>{state[x.dataset.filter]=x.value;if(x.dataset.filter==='country')state.language=countryInfo()[2]});$('#provider').onchange=e=>state.provider=e.target.value;$('#perPage').onchange=e=>{state.perPage=+e.target.value;state.pageNo=1;render()};$$('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;localStorage.newsView=state.view;render()});$$('[data-p]').forEach(b=>b.onclick=()=>{state.pageNo=+b.dataset.p;render();scrollTo({top:300,behavior:'smooth'})});bindCards()}
function card(x){return `<article class="card" data-id="${esc(x.id)}"><div class="thumb" role="link" tabindex="0" aria-label="Open source story: ${esc(x.title)}"><img loading="lazy" decoding="async" fetchpriority="low" src="${esc(x.image)}" alt="${esc(x.title)}" onerror="this.onerror=null;this.src=sourceBrand('${esc(x.source)}')"></div><div class="cardBody"><div class="title">${esc(x.title)}</div><div class="meta"><span class="badge">${esc(x.source)}</span> ${esc(x.category||'')}</div><div class="newsDesc">${esc(x.description)}</div><div class="newsTime">${formatDate(x.publishedAt)}</div><div class="engage"><button class="btn likeBtn">♥ ${state.likes[x.id]||0}</button><button class="btn commentBtn">💬 ${state.comments[x.id]?.length||0}</button><button class="btn shareBtn">↗ Share</button><button class="btn saveBtn">${state.saved.has(x.id)?'★':'☆'}</button></div></div></article>`}
function bindCards(){$$('.card').forEach(c=>{const x=find(c.dataset.id);if(!x)return;const open=()=>openStory(x);c.querySelector('.thumb').onclick=open;c.querySelector('.thumb').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};c.querySelector('.likeBtn').onclick=()=>{state.likes[x.id]=(state.likes[x.id]||0)+1;localStorage.newsLikes=JSON.stringify(state.likes);state.community.preferences={updated:new Date().toISOString(),likes:state.likes,comments:state.comments};localStorage.newsCommunitySpace=JSON.stringify(state.community);render()};c.querySelector('.commentBtn').onclick=()=>comments(x);c.querySelector('.shareBtn').onclick=()=>share(x);c.querySelector('.saveBtn').onclick=()=>{state.saved.has(x.id)?state.saved.delete(x.id):state.saved.add(x.id);localStorage.savedNews=JSON.stringify([...state.saved]);render()}})}
function find(id){return state.results.find(x=>x.id===id)||state.recent.find(x=>x.id===id)}function openStory(x){state.recent=[x,...state.recent.filter(y=>y.id!==x.id)].slice(0,50);localStorage.recentNews=JSON.stringify(state.recent);window.open(x.url,'_blank','noopener,noreferrer')}
function comments(x){const m=$('#modal'),list=state.comments[x.id]||[];m.className='modal open';m.innerHTML=`<div class="dialog"><div class="dialogHead"><b>Comments</b><button id="cx" class="iconBtn">✕</button></div><div class="dialogBody"><h3>${esc(x.title)}</h3><div>${list.map(v=>`<div class="comment">${esc(v.text)}<div class="muted">${formatDate(v.date)}</div></div>`).join('')||'<p class="muted">No local comments yet.</p>'}</div><div class="field"><label>Add a comment stored in this browser</label><textarea id="commentText" maxlength="500"></textarea></div><button class="btn primary" id="addComment">Add comment</button></div></div>`;$('#cx').onclick=()=>m.className='modal';$('#addComment').onclick=()=>{const text=$('#commentText').value.trim();if(!text)return;(state.comments[x.id]??=[]).push({text,date:new Date().toISOString()});localStorage.newsComments=JSON.stringify(state.comments);state.community.preferences={updated:new Date().toISOString(),likes:state.likes,comments:state.comments};localStorage.newsCommunitySpace=JSON.stringify(state.community);m.className='modal';render()}}
function share(x){const m=$('#modal'),u=encodeURIComponent(x.url),t=encodeURIComponent(x.title),links=[['Facebook',`https://www.facebook.com/sharer/sharer.php?u=${u}`],['X',`https://twitter.com/intent/tweet?url=${u}&text=${t}`],['LinkedIn',`https://www.linkedin.com/sharing/share-offsite/?url=${u}`],['WhatsApp',`https://api.whatsapp.com/send?text=${t}%20${u}`],['Telegram',`https://t.me/share/url?url=${u}&text=${t}`],['Reddit',`https://www.reddit.com/submit?url=${u}&title=${t}`],['Email',`mailto:?subject=${t}&body=${u}`]];if(navigator.share){navigator.share({title:x.title,url:x.url}).catch(()=>{});return}m.className='modal open';m.innerHTML=`<div class="dialog"><div class="dialogHead"><b>Share story</b><button id="sx" class="iconBtn">✕</button></div><div class="dialogBody">${links.map(([n,l])=>`<a class="btn" href="${l}" target="_blank" rel="noopener">${n}</a>`).join(' ')} <button class="btn" id="copyLink">Copy link</button><p class="muted">Instagram does not provide a general web URL-share endpoint. Copy the link and paste it in Instagram.</p></div></div>`;$('#sx').onclick=()=>m.className='modal';$('#copyLink').onclick=()=>navigator.clipboard.writeText(x.url).then(()=>toast('Link copied'))}
function formatDate(v){if(!v)return'';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString([],{dateStyle:'medium',timeStyle:'short'})}function pagination(){const n=Math.ceil(state.results.length/state.perPage);if(n<2)return'';return `<nav class="pagination"><button class="pageBtn" data-p="${state.pageNo-1}" ${state.pageNo===1?'disabled':''}>Previous</button><span>Page ${state.pageNo} of ${n}</span><button class="pageBtn" data-p="${state.pageNo+1}" ${state.pageNo===n?'disabled':''}>Next</button></nav>`}
async function load(top=false){state.query=$('#q')?.value.trim()||state.query;const ids=selected();if(!ids.length){toast('Select at least one source in Settings.');return nav('settings')}state.loading=true;state.pageNo=1;render();try{const settled=await Promise.allSettled(ids.map(id=>loadFeed(id,state.query,top))),rows=settled.flatMap(x=>x.status==='fulfilled'?x.value:[]);state.results=rank(dedupe(rows),state.query).slice(0,100);const failed=settled.filter(x=>x.status==='rejected').length;if(!state.results.length)toast('No stories returned. Try another phrase or select Google News.');else if(failed&&ids.length>1)toast(`${failed} feed(s) could not load. Available results are shown.`)}catch(e){state.results=[];toast('News could not be loaded. Please try again.')}finally{state.loading=false;render()}}

function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice search is not supported.');const r=new SR;r.onresult=e=>{$('#q').value=e.results[0][0].transcript;load(state.page==='top')};r.start()}
$$('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));$('#noticeBtn').onclick=showNotice;$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.newsTheme=document.body.classList.contains('dark')?'dark':'light'};if(localStorage.newsTheme==='dark'||(!localStorage.newsTheme&&matchMedia('(prefers-color-scheme:dark)').matches))document.body.classList.add('dark');$('#helpBtn').onclick=()=>{const m=$('#modal');m.className='modal open';m.innerHTML=`<div class="dialog"><div class="dialogHead"><b>Help & limitations</b><button id="hx" class="iconBtn">✕</button></div><div class="dialogBody"><p>Available feed pictures are shown. If a feed provides no picture, the card uses a publisher-branded fallback. A standalone browser page cannot safely screenshot arbitrary news sites because cross-origin protections block page capture.</p><p>Public “most viewed”, “liked” and “commented” counts are not supplied by standard news feeds. Top picks therefore use relevance, freshness, and engagement recorded locally in this browser.</p></div></div>`;$('#hx').onclick=()=>m.className='modal'};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').className='modal';if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();nav('search');setTimeout(()=>$('#q')?.focus())}});render();setTimeout(()=>load(false),80);
</script></body></html>
